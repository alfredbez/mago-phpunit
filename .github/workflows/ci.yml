name: tests

on:
  push:
  pull_request:

jobs:
  suite:
    name: PHPUnit ${{ matrix.phpunit }} / Mago ${{ matrix.mago }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - phpunit: "^10.5"
            php: "8.3"
            mago: "latest"
          - phpunit: "^11.5"
            php: "8.3"
            mago: "latest"
          - phpunit: "^12.0"
            php: "8.3"
            mago: "latest"
          - phpunit: "^13.0"
            php: "8.4"
            mago: "latest"
          - phpunit: "^10.5"
            php: "8.3"
            mago: "1.60.2"
          - phpunit: "^13.0"
            php: "8.4"
            mago: "1.60.2"
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, mbstring, xml, zip
          tools: composer

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies (latest Mago)
        if: matrix.mago == 'latest'
        run: composer update --no-interaction --prefer-dist --no-progress --with="phpunit/phpunit:${{ matrix.phpunit }}"

      - name: Install dependencies (pinned Mago)
        if: matrix.mago != 'latest'
        run: composer update --no-interaction --prefer-dist --no-progress --with="phpunit/phpunit:${{ matrix.phpunit }}" --with="carthage-software/mago:${{ matrix.mago }}"

      - name: Verify installed Mago version
        if: matrix.mago != 'latest'
        run: test "$(php vendor/bin/mago --version)" = "mago ${{ matrix.mago }}"

      - name: Validate conformance catalog
        run: php tests/check-spec.php

      - name: Run suite
        run: composer test

name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, xml
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install benchmark integration
        run: python3 -m pip install 'pytest-codspeed==5.0.3'
      - name: Generate fixtures and prepare Mago
        run: |
          php bench/generate.php
          php vendor/bin/mago --version
      - name: Run benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: walltime

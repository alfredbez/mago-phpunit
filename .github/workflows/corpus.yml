name: Corpus

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: curl, mbstring, xml, zip
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run pinned OSS corpus smoke check
        run: php tools/corpus-run.php --target=phpunit --check --json=corpus-report.json

      - name: Upload corpus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report
          path: corpus-report.json
          if-no-files-found: ignore
